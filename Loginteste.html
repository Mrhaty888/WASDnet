
<?php
// 1. ATIVAR A MEMÓRIA (Sempre na primeira linha do arquivo)
session_start();

// C - CREATE: Se o usuário enviou o formulário, guarda o nome na lista
if (isset($_POST['nome_do_gamer'])) {
    $_SESSION['lista_gamers'][] = $_POST['nome_do_gamer'];
}

// D - DELETE: Se o usuário clicou em excluir, apaga da lista
if (isset($_GET['excluir'])) {
    $id = $_GET['excluir'];
    unset($_SESSION['lista_gamers'][$id]);
}
?>

                echo "<li>" . $nome . " <a href='index.php?excluir=" . $id . "'>[X] Excluir</a></li>";
            }
